name: Native

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full Windows native config matrix"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      macos_sanitizers:
        description: "Run the macOS native ASAN/TSAN gate"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 20 * * 0"
  push:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/ci/**"
      - "scripts/dev/**"
      - "toolchains/**"
      - "macos/**"
      - "native/**"
      - "THIRD_PARTY_NOTICES.md"
      - "resources/video/**"
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/ci/**"
      - "scripts/dev/**"
      - "toolchains/**"
      - "macos/**"
      - "native/**"
      - "THIRD_PARTY_NOTICES.md"
      - "resources/video/**"

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-artifacts:
    name: FFmpeg artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false

      - name: Download locked FFmpeg artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/download_ffmpeg_artifacts.sh build/ci-ffmpeg

      - uses: actions/upload-artifact@v7
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg
          retention-days: 1

  native-test:
    name: Native test
    needs: ffmpeg-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: pwsh
        run: python scripts/ci/init_analysis_submodules.py

      - uses: actions/download-artifact@v8
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify Windows FFmpeg artifact
        shell: pwsh
        run: scripts/ci/restore_ffmpeg_windows.ps1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            diffutils
            make
            nasm
            pkgconf

      - name: Install Python test/build dependencies
        run: python -m pip install --upgrade pip pytest pybind11

      - name: Check release compliance notices
        shell: pwsh
        run: python scripts/dev/check_release_compliance.py

      - name: Run Windows PR fast gate
        shell: pwsh
        run: python dev.py gate pr-fast

  macos-native-test:
    name: macOS native test
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run macOS native fast gate
        shell: bash
        run: bash scripts/ci/run_macos_native_fast.sh

  macos-native-sanitizers:
    name: macOS native sanitizers
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.macos_sanitizers == 'true') }}
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run macOS native sanitizer gate
        shell: bash
        run: python3.12 dev.py gate macos-native-sanitizers

  macos-analysis-build:
    name: macOS analysis build
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: bash
        run: python3 scripts/ci/init_analysis_submodules.py

      - uses: actions/download-artifact@v8
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare macOS FFmpeg analyzer
        shell: bash
        run: python -c "from scripts.dev.native import ensure_ffmpeg_analyzer_tool; ensure_ffmpeg_analyzer_tool()"

      - name: Configure macOS analysis library
        shell: bash
        run: >
          cmake -S native -B native/build-ci-macos-analysis
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_ANALYSIS=ON
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_TESTS=ON
          -DBUILD_PYTHON=OFF

      - name: Build macOS analysis smokes
        shell: bash
        run: |
          cmake --build native/build-ci-macos-analysis --target macos_analysis_ffi_smoke -- -j "$(sysctl -n hw.ncpu)"
          cmake --build native/build-ci-macos-analysis --target macos_analysis_toolchain_smoke -- -j "$(sysctl -n hw.ncpu)"

      - name: Run macOS analysis smokes
        shell: bash
        run: ctest --test-dir native/build-ci-macos-analysis -R "macos_analysis_(ffi|toolchain)_smoke" --output-on-failure

  macos-runner-build:
    name: macOS runner build
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: bash
        run: python3 scripts/ci/init_analysis_submodules.py

      - uses: actions/download-artifact@v8
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: .toolchains/flutter
          key: voidplayer-flutter-${{ runner.os }}-${{ hashFiles('toolchains/flutter.lock.json') }}

      - name: Bootstrap pinned Flutter toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHON=python3.12 scripts/ci/bootstrap_flutter_toolchain.sh

      - name: Bootstrap pinned macOS Flutter engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/bootstrap_flutter_macos_engine.sh

      - name: Build macOS Flutter runner
        shell: bash
        run: python3.12 dev.py build --flutter --debug

  native-config-matrix:
    name: Full native config matrix / ${{ matrix.name }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true') }}
    needs: ffmpeg-artifacts
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-analysis-tests
            build_python: "OFF"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Release"
          - name: debug-analysis-tests
            build_python: "OFF"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Debug"
          - name: release-renderer-tests
            build_python: "OFF"
            build_tests: "ON"
            build_analysis: "OFF"
            config: "Release"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        if: ${{ matrix.build_analysis == 'ON' }}
        shell: pwsh
        run: python scripts/ci/init_analysis_submodules.py

      - uses: actions/download-artifact@v8
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify Windows FFmpeg artifact
        shell: pwsh
        run: scripts/ci/restore_ffmpeg_windows.ps1

      - name: Configure native
        shell: pwsh
        run: >
          cmake -S native -B "native/build-ci-${{ matrix.name }}"
          -DBUILD_PYTHON=${{ matrix.build_python }}
          -DBUILD_TESTS=${{ matrix.build_tests }}
          -DBUILD_ANALYSIS=${{ matrix.build_analysis }}
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build native
        shell: pwsh
        run: cmake --build "native/build-ci-${{ matrix.name }}" --config ${{ matrix.config }} --parallel
