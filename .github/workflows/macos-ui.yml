name: macOS UI

permissions:
  actions: read
  contents: read

# Hosted macOS UI smoke uses software decode for baseline runner coverage;
# hardware/EDR-specific presentation smokes stay in targeted local/nightly gates.

on:
  pull_request:
    paths:
      - ".github/workflows/macos-ui.yml"
      - "dev.py"
      - "lib/**"
      - "macos/**"
      - "native/**"
      - "resources/video/h264_9s_1920x1080.mp4"
      - "scripts/**"
      - "toolchains/**"
      - "ui_tests/macos/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "macOS UI gate profile"
        required: true
        default: "macos-ui-smoke"
        type: choice
        options:
          - "macos-ui-smoke"
          - "macos-ui-nightly"
  schedule:
    - cron: "47 20 * * 0"

concurrency:
  group: macos-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-ui:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event_name == 'schedule' && 'macos-ui-nightly' || 'macos-ui-smoke' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: bash
        run: python3 scripts/ci/init_analysis_submodules.py

      - name: Pull headed UI media fixtures
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="resources/video/h264_9s_1920x1080.mp4"
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event_name == 'schedule' && 'macos-ui-nightly' || 'macos-ui-smoke' }}" == "macos-ui-nightly" ]]; then
            git lfs pull --include="resources/video/h266_10s_1920x1080.mp4,resources/video/mhw_hevc_fullrange_bt709_3s.mp4,resources/video/h264_high422p_1s_320x180.mp4,resources/video/ffv1_yuv422p_8bit.mkv,resources/video/ffv1_yuv444p_8bit.mkv,resources/video/ffv1_yuv422p10le.mkv,resources/video/ffv1_yuv444p10le.mkv"
          fi

      - name: Download locked FFmpeg artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/download_ffmpeg_artifacts.sh build/ci-ffmpeg macos-arm64

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: .toolchains/flutter
          key: voidplayer-flutter-${{ runner.os }}-${{ hashFiles('toolchains/flutter.lock.json') }}

      - name: Bootstrap pinned Flutter toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHON=python3.12 scripts/ci/bootstrap_flutter_toolchain.sh

      - name: Bootstrap pinned macOS Flutter engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/bootstrap_flutter_macos_engine.sh

      - name: Install media generation tools
        run: brew install ffmpeg

      - name: Run macOS UI gate
        shell: bash
        run: python3.12 dev.py gate "${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event_name == 'schedule' && 'macos-ui-nightly' || 'macos-ui-smoke' }}"
