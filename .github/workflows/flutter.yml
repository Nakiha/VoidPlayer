name: Flutter

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/flutter.yml"
      - "analysis_options.yaml"
      - "dev.py"
      - "l10n.yaml"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test/**"
      - "third_party/desktop_drop/**"
  pull_request:
    paths:
      - ".github/workflows/flutter.yml"
      - "analysis_options.yaml"
      - "dev.py"
      - "l10n.yaml"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test/**"
      - "third_party/desktop_drop/**"

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-test:
    name: Flutter analyze and unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test test/unit
