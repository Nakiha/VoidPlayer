name: Flutter

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/flutter.yml"
      - "analysis_options.yaml"
      - "dev.py"
      - "l10n.yaml"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "scripts/ci/**"
      - "scripts/dev/**"
      - "test/**"
      - "third_party/desktop_drop/**"
      - "toolchains/**"
  pull_request:
    paths:
      - ".github/workflows/flutter.yml"
      - "analysis_options.yaml"
      - "dev.py"
      - "l10n.yaml"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "scripts/ci/**"
      - "scripts/dev/**"
      - "test/**"
      - "third_party/desktop_drop/**"
      - "toolchains/**"

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-test:
    name: Flutter analyze and unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .toolchains/flutter
          key: voidplayer-flutter-${{ runner.os }}-${{ hashFiles('toolchains/flutter.lock.json') }}

      - name: Bootstrap pinned Flutter toolchain
        run: PYTHON=python3.12 scripts/ci/bootstrap_flutter_toolchain.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test test/unit
