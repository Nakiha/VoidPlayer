name: Native

on:
  push:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/dev/**"
      - "macos/**"
      - "native/**"
      - "third_party/ffmpeg/**"
      - "THIRD_PARTY_NOTICES.md"
      - "windows/libs/ffmpeg/**"
      - "resources/video/**"
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/dev/**"
      - "macos/**"
      - "native/**"
      - "third_party/ffmpeg/**"
      - "THIRD_PARTY_NOTICES.md"
      - "windows/libs/ffmpeg/**"
      - "resources/video/**"

jobs:
  native-test:
    name: Native test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            diffutils
            make
            nasm
            pkgconf

      - name: Install Python test/build dependencies
        run: python -m pip install --upgrade pip pytest pybind11

      - name: Check release compliance notices
        shell: pwsh
        run: python scripts/dev/check_release_compliance.py

      - name: Run native build
        shell: pwsh
        run: python dev.py test --native-only --github

  macos-native-test:
    name: macOS native test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify macOS FFmpeg LFS artifacts
        shell: bash
        run: |
          dylib="third_party/ffmpeg/lib/libavcodec.62.28.100.dylib"
          test -s "$dylib"
          if grep -q "version https://git-lfs.github.com/spec/v1" "$dylib"; then
            echo "macOS FFmpeg dylib is still a Git LFS pointer" >&2
            exit 1
          fi

      - name: Run macOS native tests
        shell: bash
        env:
          VOIDPLAYER_DISABLE_VIDEOTOOLBOX: "1"
        run: python dev.py test --native-only

  native-config-matrix:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-off-ffi-on-tests-on
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Release"
          - name: debug-python-off-ffi-on-tests-on
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Debug"
          - name: python-off-ffi-on-tests-off
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "OFF"
            build_analysis: "ON"
            config: "Release"
          - name: python-off-ffi-off-tests-off
            build_python: "OFF"
            build_ffi: "OFF"
            build_tests: "OFF"
            build_analysis: "ON"
            config: "Release"
          - name: analysis-off-ffi-on-tests-off
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "OFF"
            build_analysis: "OFF"
            config: "Release"
          - name: analysis-off-ffi-off-tests-on
            build_python: "OFF"
            build_ffi: "OFF"
            build_tests: "ON"
            build_analysis: "OFF"
            config: "Release"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure native
        shell: pwsh
        run: >
          cmake -S native -B "native/build-ci-${{ matrix.name }}"
          -DBUILD_PYTHON=${{ matrix.build_python }}
          -DBUILD_FFI=${{ matrix.build_ffi }}
          -DBUILD_TESTS=${{ matrix.build_tests }}
          -DBUILD_ANALYSIS=${{ matrix.build_analysis }}
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build native
        shell: pwsh
        run: cmake --build "native/build-ci-${{ matrix.name }}" --config ${{ matrix.config }} --parallel

      - name: Run FFI ABI smoke
        if: ${{ matrix.build_ffi == 'ON' && matrix.build_tests == 'ON' }}
        shell: pwsh
        run: ctest --test-dir "native/build-ci-${{ matrix.name }}" -C ${{ matrix.config }} --output-on-failure -R test_ffi_c

      - name: Check FFI dist smoke
        if: ${{ matrix.build_ffi == 'ON' }}
        shell: pwsh
        run: python scripts/dev/check_native_dist.py --ffi "native/build-ci-${{ matrix.name }}/dist/ffi"
