name: Native

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full Windows native config matrix"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 20 * * 0"
  push:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/ci/**"
      - "scripts/dev/**"
      - "macos/**"
      - "native/**"
      - "third_party/ffmpeg/**"
      - "THIRD_PARTY_NOTICES.md"
      - "windows/libs/ffmpeg/**"
      - "resources/video/**"
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/ci/**"
      - "scripts/dev/**"
      - "macos/**"
      - "native/**"
      - "third_party/ffmpeg/**"
      - "THIRD_PARTY_NOTICES.md"
      - "windows/libs/ffmpeg/**"
      - "resources/video/**"

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-artifacts:
    name: FFmpeg artifacts
    runs-on: ubuntu-latest
    outputs:
      build_run_id: ${{ steps.restore.outputs.run_id }}
    steps:
      - name: Download FFmpeg build artifacts
        id: restore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in 1 2 3; do
            run_id="$(gh run list -R Nakiha/VoidPlayer-FFmpeg-Build --workflow "Build FFmpeg" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')" && test -n "$run_id" && break
            sleep $((attempt * 10))
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          rm -rf build/ci-ffmpeg
          mkdir -p build/ci-ffmpeg
          gh run download "$run_id" -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-windows-x64-n8.1 --dir build/ci-ffmpeg
          gh run download "$run_id" -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-macos-arm64-n8.1 --dir build/ci-ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg
          retention-days: 1

  native-test:
    name: Native test
    needs: ffmpeg-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>$null || $true
          git config --global --unset-all http.https://github.com/.extraheader 2>$null || $true
          git -c http.https://github.com/.extraheader= submodule sync -- native/analysis/vendor/ffmpeg native/analysis/vendor/zstd
          git -c http.https://github.com/.extraheader= submodule update --init --recursive --checkout native/analysis/vendor/ffmpeg native/analysis/vendor/zstd

      - uses: actions/download-artifact@v4
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify Windows FFmpeg artifact
        shell: pwsh
        run: scripts/ci/restore_ffmpeg_windows.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            diffutils
            make
            nasm
            pkgconf

      - name: Install Python test/build dependencies
        run: python -m pip install --upgrade pip pytest pybind11

      - name: Check release compliance notices
        shell: pwsh
        run: python scripts/dev/check_release_compliance.py

      - name: Run native build
        shell: pwsh
        run: python dev.py test --native-only --github

  macos-native-test:
    name: macOS native test
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        env:
          VOIDPLAYER_FFMPEG_BUILD_RUN_ID: ${{ needs.ffmpeg-artifacts.outputs.build_run_id }}
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run macOS native fast gate
        shell: bash
        run: bash scripts/ci/run_macos_native_fast.sh

  macos-analysis-build:
    name: macOS analysis build
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git -c http.https://github.com/.extraheader= submodule sync -- native/analysis/vendor/ffmpeg native/analysis/vendor/zstd
          git -c http.https://github.com/.extraheader= submodule update --init --recursive --checkout native/analysis/vendor/ffmpeg native/analysis/vendor/zstd

      - uses: actions/download-artifact@v4
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        env:
          VOIDPLAYER_FFMPEG_BUILD_RUN_ID: ${{ needs.ffmpeg-artifacts.outputs.build_run_id }}
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare macOS FFmpeg analyzer
        shell: bash
        run: python -c "from scripts.dev.native import ensure_ffmpeg_analyzer_tool; ensure_ffmpeg_analyzer_tool()"

      - name: Configure macOS analysis library
        shell: bash
        run: >
          cmake -S native -B native/build-ci-macos-analysis
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_ANALYSIS=ON
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_TESTS=OFF
          -DBUILD_FFI=OFF
          -DBUILD_PYTHON=OFF

      - name: Build macOS analysis smokes
        shell: bash
        run: |
          cmake --build native/build-ci-macos-analysis --target macos_analysis_ffi_smoke -- -j "$(sysctl -n hw.ncpu)"
          cmake --build native/build-ci-macos-analysis --target macos_analysis_toolchain_smoke -- -j "$(sysctl -n hw.ncpu)"

      - name: Run macOS analysis smokes
        shell: bash
        run: ctest --test-dir native/build-ci-macos-analysis -R "macos_analysis_(ffi|toolchain)_smoke" --output-on-failure

  macos-runner-build:
    name: macOS runner build
    needs: ffmpeg-artifacts
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git -c http.https://github.com/.extraheader= submodule sync -- native/analysis/vendor/ffmpeg native/analysis/vendor/zstd
          git -c http.https://github.com/.extraheader= submodule update --init --recursive --checkout native/analysis/vendor/ffmpeg native/analysis/vendor/zstd

      - uses: actions/download-artifact@v4
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify macOS FFmpeg artifact
        shell: bash
        env:
          VOIDPLAYER_FFMPEG_BUILD_RUN_ID: ${{ needs.ffmpeg-artifacts.outputs.build_run_id }}
        run: bash scripts/ci/restore_ffmpeg_macos.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Build macOS Flutter runner
        shell: bash
        run: flutter build macos --debug

  native-config-matrix:
    name: Full native config matrix / ${{ matrix.name }}
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix == 'true') }}
    needs: ffmpeg-artifacts
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-off-ffi-on-tests-on
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Release"
          - name: debug-python-off-ffi-on-tests-on
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Debug"
          - name: python-off-ffi-on-tests-off
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "OFF"
            build_analysis: "ON"
            config: "Release"
          - name: python-off-ffi-off-tests-off
            build_python: "OFF"
            build_ffi: "OFF"
            build_tests: "OFF"
            build_analysis: "ON"
            config: "Release"
          - name: analysis-off-ffi-on-tests-off
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "OFF"
            build_analysis: "OFF"
            config: "Release"
          - name: analysis-off-ffi-off-tests-on
            build_python: "OFF"
            build_ffi: "OFF"
            build_tests: "ON"
            build_analysis: "OFF"
            config: "Release"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
          fetch-depth: 0

      - name: Initialize analysis submodules
        if: ${{ matrix.build_analysis == 'ON' }}
        shell: pwsh
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>$null || $true
          git config --global --unset-all http.https://github.com/.extraheader 2>$null || $true
          git -c http.https://github.com/.extraheader= submodule sync -- native/analysis/vendor/ffmpeg native/analysis/vendor/zstd
          git -c http.https://github.com/.extraheader= submodule update --init --recursive --checkout native/analysis/vendor/ffmpeg native/analysis/vendor/zstd

      - uses: actions/download-artifact@v4
        with:
          name: ci-ffmpeg-artifacts
          path: build/ci-ffmpeg

      - name: Restore and verify Windows FFmpeg artifact
        shell: pwsh
        run: scripts/ci/restore_ffmpeg_windows.ps1

      - name: Configure native
        shell: pwsh
        run: >
          cmake -S native -B "native/build-ci-${{ matrix.name }}"
          -DBUILD_PYTHON=${{ matrix.build_python }}
          -DBUILD_FFI=${{ matrix.build_ffi }}
          -DBUILD_TESTS=${{ matrix.build_tests }}
          -DBUILD_ANALYSIS=${{ matrix.build_analysis }}
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build native
        shell: pwsh
        run: cmake --build "native/build-ci-${{ matrix.name }}" --config ${{ matrix.config }} --parallel

      - name: Run FFI ABI smoke
        if: ${{ matrix.build_ffi == 'ON' && matrix.build_tests == 'ON' }}
        shell: pwsh
        run: ctest --test-dir "native/build-ci-${{ matrix.name }}" -C ${{ matrix.config }} --output-on-failure -R test_ffi_c

      - name: Check FFI dist smoke
        if: ${{ matrix.build_ffi == 'ON' }}
        shell: pwsh
        run: python scripts/dev/check_native_dist.py --ffi "native/build-ci-${{ matrix.name }}/dist/ffi"
