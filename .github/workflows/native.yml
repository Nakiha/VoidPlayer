name: Native

on:
  push:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/dev/**"
      - "macos/**"
      - "native/**"
      - "third_party/ffmpeg/**"
      - "THIRD_PARTY_NOTICES.md"
      - "windows/libs/ffmpeg/**"
      - "resources/video/**"
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "dev.py"
      - "scripts/dev/**"
      - "macos/**"
      - "native/**"
      - "third_party/ffmpeg/**"
      - "THIRD_PARTY_NOTICES.md"
      - "windows/libs/ffmpeg/**"
      - "resources/video/**"

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: Native test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0

      - name: Restore Windows FFmpeg artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh run list -R Nakiha/VoidPlayer-FFmpeg-Build --workflow "Build FFmpeg" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId'
          if (-not $runId) { throw "No successful VoidPlayer-FFmpeg-Build run found" }
          Remove-Item -Recurse -Force build/ci-ffmpeg -ErrorAction SilentlyContinue
          gh run download $runId -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-windows-x64-n8.1 --dir build/ci-ffmpeg
          $zip = Get-ChildItem build/ci-ffmpeg -Recurse -Filter voidplayer-ffmpeg-windows-x64-n8.1.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows FFmpeg artifact zip not found" }
          Expand-Archive -Force $zip.FullName build/ci-ffmpeg/unpacked
          Remove-Item -Recurse -Force windows/libs/ffmpeg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force windows/libs | Out-Null
          Move-Item build/ci-ffmpeg/unpacked/voidplayer-ffmpeg-windows-x64-n8.1 windows/libs/ffmpeg

      - name: Verify Windows FFmpeg artifacts
        shell: pwsh
        run: |
          $dll = "windows/libs/ffmpeg/bin/avcodec-62.dll"
          if ((Get-Item $dll).Length -lt 1000000) {
            Write-Error "Windows FFmpeg DLL is unexpectedly small: $dll"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $prefix = [System.Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min($bytes.Length, 64))
          if ($prefix.StartsWith("version https://git-lfs.github.com/spec/v1")) {
            Write-Error "Windows FFmpeg DLL is still a Git LFS pointer: $dll"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            diffutils
            make
            nasm
            pkgconf

      - name: Install Python test/build dependencies
        run: python -m pip install --upgrade pip pytest pybind11

      - name: Check release compliance notices
        shell: pwsh
        run: python scripts/dev/check_release_compliance.py

      - name: Run native build
        shell: pwsh
        run: python dev.py test --native-only --github

  macos-native-test:
    name: macOS native test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0

      - name: Restore macOS FFmpeg artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list -R Nakiha/VoidPlayer-FFmpeg-Build --workflow "Build FFmpeg" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          test -n "$run_id"
          rm -rf build/ci-ffmpeg
          gh run download "$run_id" -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-macos-arm64-n8.1 --dir build/ci-ffmpeg
          zip_path="$(find build/ci-ffmpeg -name 'voidplayer-ffmpeg-macos-arm64-n8.1.zip' -print -quit)"
          test -n "$zip_path"
          unzip -q "$zip_path" -d build/ci-ffmpeg/unpacked
          rm -rf third_party/ffmpeg
          mkdir -p third_party
          mv build/ci-ffmpeg/unpacked/voidplayer-ffmpeg-macos-arm64-n8.1 third_party/ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify macOS FFmpeg artifacts
        shell: bash
        run: |
          dylib="third_party/ffmpeg/lib/libavcodec.62.28.100.dylib"
          test -s "$dylib"
          if grep -q "version https://git-lfs.github.com/spec/v1" "$dylib"; then
            echo "macOS FFmpeg dylib is still a Git LFS pointer" >&2
            exit 1
          fi

      - name: Run macOS native tests
        shell: bash
        env:
          VOIDPLAYER_DISABLE_VIDEOTOOLBOX: "1"
        run: python dev.py test --native-only

  macos-analysis-build:
    name: macOS analysis build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0

      - name: Restore macOS FFmpeg artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list -R Nakiha/VoidPlayer-FFmpeg-Build --workflow "Build FFmpeg" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          test -n "$run_id"
          rm -rf build/ci-ffmpeg
          gh run download "$run_id" -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-macos-arm64-n8.1 --dir build/ci-ffmpeg
          zip_path="$(find build/ci-ffmpeg -name 'voidplayer-ffmpeg-macos-arm64-n8.1.zip' -print -quit)"
          test -n "$zip_path"
          unzip -q "$zip_path" -d build/ci-ffmpeg/unpacked
          rm -rf third_party/ffmpeg
          mkdir -p third_party
          mv build/ci-ffmpeg/unpacked/voidplayer-ffmpeg-macos-arm64-n8.1 third_party/ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify macOS FFmpeg artifacts
        shell: bash
        run: |
          dylib="third_party/ffmpeg/lib/libavcodec.62.28.100.dylib"
          test -s "$dylib"
          if grep -q "version https://git-lfs.github.com/spec/v1" "$dylib"; then
            echo "macOS FFmpeg dylib is still a Git LFS pointer" >&2
            exit 1
          fi

      - name: Configure macOS analysis library
        shell: bash
        run: >
          cmake -S native -B native/build-ci-macos-analysis
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_ANALYSIS=ON
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_TESTS=OFF
          -DBUILD_FFI=OFF
          -DBUILD_PYTHON=OFF

      - name: Build macOS analysis FFI smoke
        shell: bash
        run: cmake --build native/build-ci-macos-analysis --target macos_analysis_ffi_smoke -- -j "$(sysctl -n hw.ncpu)"

      - name: Run macOS analysis FFI smoke
        shell: bash
        run: native/build-ci-macos-analysis/macos_analysis_ffi_smoke

  macos-runner-build:
    name: macOS runner build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0

      - name: Restore macOS FFmpeg artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list -R Nakiha/VoidPlayer-FFmpeg-Build --workflow "Build FFmpeg" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          test -n "$run_id"
          rm -rf build/ci-ffmpeg
          gh run download "$run_id" -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-macos-arm64-n8.1 --dir build/ci-ffmpeg
          zip_path="$(find build/ci-ffmpeg -name 'voidplayer-ffmpeg-macos-arm64-n8.1.zip' -print -quit)"
          test -n "$zip_path"
          unzip -q "$zip_path" -d build/ci-ffmpeg/unpacked
          rm -rf third_party/ffmpeg
          mkdir -p third_party
          mv build/ci-ffmpeg/unpacked/voidplayer-ffmpeg-macos-arm64-n8.1 third_party/ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Verify macOS FFmpeg artifacts
        shell: bash
        run: |
          dylib="third_party/ffmpeg/lib/libavcodec.62.28.100.dylib"
          test -s "$dylib"
          if grep -q "version https://git-lfs.github.com/spec/v1" "$dylib"; then
            echo "macOS FFmpeg dylib is still a Git LFS pointer" >&2
            exit 1
          fi

      - name: Build macOS Flutter runner
        shell: bash
        run: flutter build macos --debug

  native-config-matrix:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-off-ffi-on-tests-on
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Release"
          - name: debug-python-off-ffi-on-tests-on
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "ON"
            build_analysis: "ON"
            config: "Debug"
          - name: python-off-ffi-on-tests-off
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "OFF"
            build_analysis: "ON"
            config: "Release"
          - name: python-off-ffi-off-tests-off
            build_python: "OFF"
            build_ffi: "OFF"
            build_tests: "OFF"
            build_analysis: "ON"
            config: "Release"
          - name: analysis-off-ffi-on-tests-off
            build_python: "OFF"
            build_ffi: "ON"
            build_tests: "OFF"
            build_analysis: "OFF"
            config: "Release"
          - name: analysis-off-ffi-off-tests-on
            build_python: "OFF"
            build_ffi: "OFF"
            build_tests: "ON"
            build_analysis: "OFF"
            config: "Release"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
          fetch-depth: 0

      - name: Restore Windows FFmpeg artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = gh run list -R Nakiha/VoidPlayer-FFmpeg-Build --workflow "Build FFmpeg" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId'
          if (-not $runId) { throw "No successful VoidPlayer-FFmpeg-Build run found" }
          Remove-Item -Recurse -Force build/ci-ffmpeg -ErrorAction SilentlyContinue
          gh run download $runId -R Nakiha/VoidPlayer-FFmpeg-Build --name voidplayer-ffmpeg-windows-x64-n8.1 --dir build/ci-ffmpeg
          $zip = Get-ChildItem build/ci-ffmpeg -Recurse -Filter voidplayer-ffmpeg-windows-x64-n8.1.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows FFmpeg artifact zip not found" }
          Expand-Archive -Force $zip.FullName build/ci-ffmpeg/unpacked
          Remove-Item -Recurse -Force windows/libs/ffmpeg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force windows/libs | Out-Null
          Move-Item build/ci-ffmpeg/unpacked/voidplayer-ffmpeg-windows-x64-n8.1 windows/libs/ffmpeg

      - name: Verify Windows FFmpeg artifacts
        shell: pwsh
        run: |
          $dll = "windows/libs/ffmpeg/bin/avcodec-62.dll"
          if ((Get-Item $dll).Length -lt 1000000) {
            Write-Error "Windows FFmpeg DLL is unexpectedly small: $dll"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $prefix = [System.Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min($bytes.Length, 64))
          if ($prefix.StartsWith("version https://git-lfs.github.com/spec/v1")) {
            Write-Error "Windows FFmpeg DLL is still a Git LFS pointer: $dll"
            exit 1
          }

      - name: Configure native
        shell: pwsh
        run: >
          cmake -S native -B "native/build-ci-${{ matrix.name }}"
          -DBUILD_PYTHON=${{ matrix.build_python }}
          -DBUILD_FFI=${{ matrix.build_ffi }}
          -DBUILD_TESTS=${{ matrix.build_tests }}
          -DBUILD_ANALYSIS=${{ matrix.build_analysis }}
          -DBUILD_ANALYSIS_TESTS=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build native
        shell: pwsh
        run: cmake --build "native/build-ci-${{ matrix.name }}" --config ${{ matrix.config }} --parallel

      - name: Run FFI ABI smoke
        if: ${{ matrix.build_ffi == 'ON' && matrix.build_tests == 'ON' }}
        shell: pwsh
        run: ctest --test-dir "native/build-ci-${{ matrix.name }}" -C ${{ matrix.config }} --output-on-failure -R test_ffi_c

      - name: Check FFI dist smoke
        if: ${{ matrix.build_ffi == 'ON' }}
        shell: pwsh
        run: python scripts/dev/check_native_dist.py --ffi "native/build-ci-${{ matrix.name }}/dist/ffi"
