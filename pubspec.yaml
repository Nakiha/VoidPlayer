name: void_player
description: "A Flutter video player with shared native FFmpeg playback and platform presentation backends."
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  crypto: ^3.0.7
  desktop_drop: ^0.7.1
  ffi: ^2.1.0
  flutter_acrylic: ^1.1.4
  intl: ^0.20.2
  logging: ^1.3.0
  path: ^1.9.0
  window_manager: ^0.5.0
  sqlite3: ^3.3.2
  sqlite3_flutter_libs: ^0.6.0+eol

dependency_overrides:
  desktop_drop:
    path: third_party/desktop_drop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
